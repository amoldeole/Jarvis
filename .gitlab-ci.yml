image: ghcr.io/cirruslabs/android-sdk:35

stages:
  - test
  - build
  - release

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_HOME: "/opt/android-sdk"
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  GIT_DEPTH: "1"

cache:
  key: "gradle-${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

.default_android:
  before_script:
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - chmod +x ./gradlew
    - yes | sdkmanager --licenses >/dev/null || true
    - sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

unit_tests:
  extends: .default_android
  stage: test
  script:
    - ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
  artifacts:
    when: always
    reports:
      junit:
        - app/build/test-results/testDebugUnitTest/**/*.xml
    expire_in: 7 days

build_debug_apk:
  extends: .default_android
  stage: build
  needs: [unit_tests]
  script:
    - ./gradlew --no-daemon --stacktrace :app:assembleDebug
    - sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256
  artifacts:
    name: "phone-guardian-debug-${CI_COMMIT_SHORT_SHA}"
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
      - app-debug.apk.sha256
    expire_in: 30 days

# Configure the masked/protected GitLab CI variables below before enabling this job:
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# The keystore is created only in the ephemeral runner workspace and is never logged.
build_release:
  extends: .default_android
  stage: release
  needs: [unit_tests]
  rules:
    - if: '$CI_COMMIT_TAG && $KEYSTORE_BASE64 && $KEYSTORE_PASSWORD && $KEY_ALIAS && $KEY_PASSWORD'
      when: manual
    - when: never
  script:
    - printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release-upload-key.jks"
    - |
      cat > "$CI_PROJECT_DIR/keystore.properties" <<EOF
      storeFile=$CI_PROJECT_DIR/release-upload-key.jks
      storePassword=$KEYSTORE_PASSWORD
      keyAlias=$KEY_ALIAS
      keyPassword=$KEY_PASSWORD
      EOF
    - ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
    - sha256sum app/build/outputs/apk/release/app-release.apk | tee app-release.apk.sha256
  artifacts:
    name: "phone-guardian-release-${CI_COMMIT_TAG}"
    paths:
      - app/build/outputs/apk/release/app-release.apk
      - app/build/outputs/bundle/release/app-release.aab
      - app-release.apk.sha256
    expire_in: 90 days
  after_script:
    - rm -f "$CI_PROJECT_DIR/release-upload-key.jks" "$CI_PROJECT_DIR/keystore.properties"
